# Configuration file for 100M parameter Bengali Language Model
# Model architecture and training hyperparameters

# Model Configuration
model:
  # Model architecture
  vocab_size: 32000
  hidden_size: 768
  num_hidden_layers: 6
  num_attention_heads: 12
  intermediate_size: 2048
  max_position_embeddings: 2048
  
  # Regularization
  dropout: 0.1
  attention_dropout: 0.1
  layer_norm_eps: 1.0e-5
  
  # Model settings
  use_cache: true
  
  # Special token IDs
  pad_token_id: 0
  bos_token_id: 2
  eos_token_id: 3
  unk_token_id: 1

# Training Configuration
training:
  # Output directory
  output_dir: "outputs/pretrain"
  
  # Batch settings
  batch_size: 32
  gradient_accumulation_steps: 4
  # Effective batch size = batch_size * gradient_accumulation_steps = 128
  
  # Optimizer settings
  learning_rate: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  
  # Learning rate schedule
  num_train_epochs: 3
  max_steps: -1  # Set to positive number to override num_train_epochs
  warmup_steps: 500
  lr_scheduler_type: "cosine"  # Options: cosine, linear, constant
  
  # Mixed precision training
  fp16: false  # Use fp16 for older GPUs (V100, P100)
  bf16: true   # Use bf16 for newer GPUs (A100, H100) - better for training
  
  # Memory optimization
  gradient_checkpointing: false  # Enable if running out of memory
  
  # Checkpointing
  save_steps: 500
  save_total_limit: 3  # Keep only 3 most recent checkpoints
  resume_from_checkpoint: null  # Path to checkpoint to resume from
  
  # Evaluation
  eval_steps: 500
  eval_accumulation_steps: 1
  
  # Logging
  logging_steps: 50
  log_to_wandb: false
  wandb_project: "bengali-lm-100m"
  wandb_run_name: null  # Will be auto-generated if null
  
  # Device and seed
  device: "cuda"  # cuda or cpu
  seed: 42

# Data Configuration
data:
  # Data paths
  train_data_path: "data/processed/train"
  val_data_path: "data/processed/val"
  
  # Tokenizer
  tokenizer_path: "tokenizer"
  
  # Dataset settings
  block_size: 2048  # Sequence length
  streaming: false  # Use streaming for very large datasets
  
  # DataLoader settings
  num_workers: 2
  pin_memory: true

# Supervised Fine-Tuning (SFT) Configuration
sft:
  # Output directory
  output_dir: "outputs/sft"
  
  # Data
  train_data_path: "data/examples/sft_data.jsonl"
  val_data_path: null
  
  # Training settings
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4  # Lower LR for fine-tuning
  num_train_epochs: 3
  max_length: 2048
  
  # Other settings inherit from training config
  warmup_steps: 100
  save_steps: 200
  logging_steps: 20
  
  # Prompt template for Bengali
  prompt_template: |
    নির্দেশ: {instruction}

    উত্তর: {response}

# Export Configuration
export:
  # Model to export
  model_path: "outputs/pretrain/best_model"
  output_dir: "exports"
  
  # Export formats
  export_onnx: true
  export_tflite: true
  export_gguf: true
  
  # Quantization settings
  quantize: true
  quantization_type: "dynamic"  # Options: dynamic, static, qat
  quantization_bits: 8  # 8 or 16 for TFLite, 4 or 8 for GGUF
  
  # TFLite specific
  tflite_optimize: true
  tflite_representative_dataset_size: 100
  
  # GGUF specific (for llama.cpp)
  gguf_type: "q4_0"  # Options: f32, f16, q4_0, q4_1, q5_0, q5_1, q8_0

# Tokenizer Training Configuration
tokenizer_training:
  # Data
  data_dir: "data/raw"
  output_dir: "tokenizer"
  
  # Tokenizer settings
  vocab_size: 32000
  min_frequency: 2
  model_name: "bengali_tokenizer"
  lowercase: false
  
  # Special tokens
  special_tokens:
    - "[PAD]"
    - "[UNK]"
    - "[BOS]"
    - "[EOS]"
    - "[MASK]"

# Evaluation Configuration
evaluation:
  # Model to evaluate
  model_path: "outputs/pretrain/best_model"
  
  # Data
  test_data_path: "data/processed/val"
  
  # Evaluation settings
  batch_size: 32
  max_samples: -1  # -1 for all samples
  
  # Metrics
  compute_perplexity: true
  compute_bleu: false
  generate_samples: true
  num_samples_to_generate: 10

# Generation Configuration
generation:
  # Generation parameters
  max_length: 200
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  repetition_penalty: 1.1
  do_sample: true
  
  # Prompts for testing
  test_prompts:
    - "একবার এক"
    - "বাংলাদেশ হল"
    - "শিক্ষা জীবনের"
