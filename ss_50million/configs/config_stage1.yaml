# Stage 1: Pretraining Configuration (Language Foundation)
stage: 1
name: "pretrain"

model:
  vocab_size: 10000
  embed_dim: 512
  num_heads: 8
  num_kv_heads: 2
  num_layers: 16
  intermediate_dim: 2048
  block_size: 256
  dropout: 0.1
  bias: false
  rope_theta: 10000.0

data:
  dataset_path: "data/corpus.txt"
  split_ratio: 0.9

training:
  num_train_epochs: 2
  learning_rate: 0.0003  # 3e-4
  min_lr: 0.00003        # 3e-5
  batch_size: 8
  gradient_accumulation_steps: 2
  warmup_iters: 250
  eval_interval: 250
  eval_iters: 25
  weight_decay: 0.1
  grad_clip: 1.0

checkpoint:
  output_dir: "checkpoints/stage_1"
  save_interval: 500
